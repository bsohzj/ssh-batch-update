name: macOS application

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      QT_QPA_PLATFORM: offscreen
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-gui.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest -v

      - name: Test interpreted GUI startup
        run: python gui.py --smoke-test

      - name: Build unsigned application
        run: pyinstaller --noconfirm --clean ssh_batch_update.spec

      - name: Test packaged GUI startup
        run: dist/SSH\ Batch\ Update.app/Contents/MacOS/SSH\ Batch\ Update --smoke-test

      - name: Verify architecture and bundle contents
        shell: bash
        run: |
          executable="dist/SSH Batch Update.app/Contents/MacOS/SSH Batch Update"
          file "$executable" | tee executable-architecture.txt
          file "$executable" | grep -q "${{ matrix.architecture }}"
          if find "dist/SSH Batch Update.app" -type f \( \
            -name '.env' -o -name 'devices.txt' -o -name 'commands.txt' -o \
            -name 'summary.csv' \
          \) -print -quit | grep -q .; then
            echo "Sensitive or user-supplied files were bundled unexpectedly."
            exit 1
          fi

      - name: Package application
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "dist/SSH Batch Update.app"
          "SSH-Batch-Update-macos-${{ matrix.architecture }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: SSH-Batch-Update-macos-${{ matrix.architecture }}
          path: SSH-Batch-Update-macos-${{ matrix.architecture }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: SSH-Batch-Update-macos-*
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-artifacts/*/*.zip
          --repo "${{ github.repository }}"
          --generate-notes
